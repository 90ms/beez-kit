name: Validate BeezKit Android

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-validation.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "build-logic/**"
      - "toolkit/**"
      - "components/**"
      - "samples/**"
  pull_request:
    paths:
      - ".github/workflows/android-validation.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "build-logic/**"
      - "toolkit/**"
      - "components/**"
      - "samples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, and assemble catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Run tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lint

      - name: Assemble catalog
        run: ./gradlew --no-daemon --stacktrace :samples:catalog:assembleDebug

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beez-kit-gradle-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
